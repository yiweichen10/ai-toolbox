<div class="cps-card">
  <div class="cps-card-hook">{HOOK}</div>
  <div class="cps-card-top">
    <div class="cps-card-brand">
      <span class="cps-card-logo">{LOGO}</span>
      <span class="cps-card-brand-text">{BRAND_TEXT}</span>
    </div>
    <span class="cps-card-tag">推广</span>
  </div>
  <div class="cps-card-name">{HEADLINE}</div>
  <div class="cps-card-desc">{DESC}</div>
  <div class="cps-card-btn-row">
    <a class="cps-card-btn" href="{URL}" target="_blank" rel="nofollow noopener sponsored"><span>{CTA}</span><span class="cps-card-arrow">&rarr;</span></a>
  </div>
</div>
