# aitoollab TTS 反代 (edge-tts, 独立服务, 不碰 AI 助手)
# 加到 /etc/nginx/conf.d/aitoollab.conf 的 server {} 块内
location = /tts {
    proxy_pass http://127.0.0.1:8088/tts;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 音频流, 关闭缓冲避免首包延迟
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location = /tts/voices {
    proxy_pass http://127.0.0.1:8088/tts/voices;
    proxy_set_header Host $host;
}
