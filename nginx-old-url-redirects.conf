# 旧文章 URL -> 新文章 URL 301 重定向（2026-08-13，Bing 4xx 修复）
#
# 背景：6-7 月内容重构时部分文章改了 slug，旧 URL 404，Bing 索引残留。
# 部署：include 进站点 server 块（或直接粘贴 location 块到 server {} 内），
#       然后执行 nginx -t && nginx -s reload。

# microsoft-build 2026 全面解读（2026-06-11 创建，后改名）
location = /articles/microsoft-build-2026-mai-thinking-seven-ai-models/ {
    return 301 https://www.aitoollab.cn/articles/microsoft-build-2026-mai-thinking-1-seven-models-0603/;
}

