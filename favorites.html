    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var clearBtn = document.getElementById('favClear');
        if (!clearBtn) return;
        clearBtn.addEventListener('click', function () {
            try { localStorage.removeItem('aitoolbox_favorites_v1'); } catch (e) {}
            var listEl = document.getElementById('favList');
            if (listEl) listEl.innerHTML = '<div class="fav-empty">还没有收藏任何工具。<a href="/">去首页逛逛 →</a></div>';
        });
    });
    </script>
    <button id="darkModeToggle" class="dark-toggle-fab" aria-label="切换暗色模式" title="暗色模式">🌙</button>
    <script>
(function(){
  var root=document.documentElement, btn=document.getElementById('darkModeToggle');
  try{if(localStorage.getItem('theme')==='dark')root.setAttribute('data-theme','dark');}catch(e){}
  function updateLabel(){
    if(btn)btn.textContent=root.getAttribute('data-theme')==='dark'?'☀️':'🌙';
  }
  updateLabel();
  if(btn)btn.addEventListener('click',function(){
    var isDark=root.getAttribute('data-theme')==='dark';
    root.setAttribute('data-theme',isDark?'light':'dark');
    try{localStorage.setItem('theme',isDark?'light':'dark');}catch(e){}
    updateLabel();
  });
})();
    </script>
